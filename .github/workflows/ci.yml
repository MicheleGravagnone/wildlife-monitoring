name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wildlife
          POSTGRES_PASSWORD: wildlife_test
          POSTGRES_DB: wildlife_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wildlife -d wildlife_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wildlife:wildlife_test@localhost:5432/wildlife_test
      TEST_DATABASE_URL: postgresql://wildlife:wildlife_test@localhost:5432/wildlife_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run db:migrate:deploy
      - run: npm run test:e2e