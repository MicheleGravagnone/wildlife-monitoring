name: CI

on:
  push:
    branches: [main, prisma]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://wildlife:wildlife_test@localhost:5432/wildlife_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck source and tests
        run: npm run typecheck
      - name: Build application
        run: npm run build
      - name: Run unit tests
        run: npm test

  integration:
    name: Database and HTTP tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wildlife
          POSTGRES_PASSWORD: wildlife_test
          POSTGRES_DB: wildlife_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wildlife -d wildlife_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wildlife:wildlife_test@localhost:5432/wildlife_test
      TEST_DATABASE_URL: postgresql://wildlife:wildlife_test@localhost:5432/wildlife_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Apply test database migrations
        run: npm run db:migrate:deploy
      - name: Run HTTP tests
        run: npm run test:e2e
